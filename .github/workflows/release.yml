name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo test --release
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - run: |
          mkdir -p pkg/bc250mon && cp target/x86_64-unknown-linux-musl/release/bc250mon README.md pkg/bc250mon/ && cp -r deploy pkg/bc250mon/
          tar -C pkg -czf bc250mon-x86_64-linux.tar.gz bc250mon
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bc250mon-x86_64-linux.tar.gz
